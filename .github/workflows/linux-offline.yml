name: Linux full-stage offline validation

on:
  pull_request:
    branches: [dev, main, feature]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install the pinned Linux dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-tui.txt -r requirements.txt
          python -c "import textual, frida"
      - name: Check Linux launcher and Python syntax
        run: |
          sh -n run-linux.sh
          sh run-linux.sh --help
          python -m py_compile macos_runner.py tui.py tui_core.py device_diagnostics.py
      - name: Offline Python suite (no Android or Google Play transactions)
        run: python -m unittest discover -s tests -v
