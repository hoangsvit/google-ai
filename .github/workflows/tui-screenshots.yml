name: Textual UI screenshots

on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: textual-screenshots-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture-real-terminal-ui:
    name: Capture Textual app screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install UI and SVG-to-PNG renderer
        run: |
          python -m pip install --disable-pip-version-check -r requirements-tui.txt
          python -m pip install --disable-pip-version-check 'CairoSVG==2.7.1' 'Pillow>=10,<13'
      - name: Capture actual dashboard and Ultra confirmation in headless terminal
        run: python scripts/capture_tui_screenshots.py
      - name: Upload real SVG and PNG screenshots
        uses: actions/upload-artifact@v4
        with:
          name: real-textual-ui-screenshots-${{ github.run_number }}
          path: artifacts/tui-screenshots/
          if-no-files-found: error
          retention-days: 14

      # Images are committed to a dedicated public preview branch, not the
      # product branch. This keeps PR comments inline and links persistent,
      # avoiding 14-day Actions ZIP downloads.
      - name: Checkout persistent screenshot branch
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/checkout@v4
        with:
          ref: ui-previews
          path: ui-previews
          persist-credentials: true
      - name: Publish real PNG screenshots for inline PR previews
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          target="ui-previews/pr-${PR_NUMBER}"
          mkdir -p "$target"
          cp artifacts/tui-screenshots/*.png "$target/"
          cp artifacts/tui-screenshots/README.txt "$target/"
          cd ui-previews
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The repo deliberately ignores all *.png for local captures.
          # This specific public preview branch intentionally contains only
          # vetted, account-free screenshots produced in this CI job.
          git add "pr-${PR_NUMBER}/README.txt"
          git add -f "pr-${PR_NUMBER}/"*.png
          if ! git diff --cached --quiet; then
            git commit -m "docs(ui): publish actual Textual screenshots for PR #${PR_NUMBER}"
            git push origin HEAD:ui-previews
          else
            echo "Preview images are unchanged."
          fi
      - name: Display inline Markdown image URLs
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "### Copy into PR comment (images render inline)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          for png in artifacts/tui-screenshots/*.png; do
            name=$(basename "$png")
            echo "![${name}](https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/ui-previews/pr-${PR_NUMBER}/${name})" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
          done
