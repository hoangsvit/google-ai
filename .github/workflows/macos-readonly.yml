name: macOS full-stage build and offline validation

on:
  pull_request:
    branches: [dev, main, feature]
    paths:
      - "run-macos.sh"
      - "ePlus-AI-Toolkit.command"
      - "macos_runner.py"
      - "tui.py"
      - "tui_core.py"
      - "device_diagnostics.py"
      - "tests/test_macos.py"
      - "docs/MACOS-PREVIEW.md"
      - ".github/workflows/macos-readonly.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-full-stage:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned Textual and Frida on macOS host
        run: |
          python -m pip install --disable-pip-version-check -r requirements-tui.txt "frida==16.5.9"
          python -c "import importlib.metadata as m; import textual, frida; assert m.version('frida') == '16.5.9'"
      - name: Check launcher syntax, help and Python
        run: |
          sh -n run-macos.sh
          sh -n ePlus-AI-Toolkit.command
          sh run-macos.sh --help
          python -m py_compile macos_runner.py tui.py tui_core.py ultra0.py device_selector.py
      - name: Mock-only tests for all six stage routes and payment guards
        run: python -m unittest discover -s tests -p 'test_macos.py' -v
      - name: Package runnable macOS source bundle and SHA-256
        shell: bash
        run: |
          set -euo pipefail
          name="eplus-ai-toolkit-macos-${{ matrix.os }}"
          zip="$RUNNER_TEMP/$name.zip"
          git archive --format=zip --output="$zip" HEAD \
            run-macos.sh ePlus-AI-Toolkit.command macos_runner.py \
            tui.py tui_core.py ultra0.py device_selector.py device_diagnostics.py \
            requirements.txt requirements-tui.txt \
            scripts/runtime-lookup.py \
            assets/frida/billing.js assets/modules/module_521.b64 \
            README.md docs/MACOS-PREVIEW.md \
            DISCLAIMER.md SECURITY.md THIRD_PARTY_NOTICES.md
          test -s "$zip"
          (cd "$RUNNER_TEMP" && shasum -a 256 "$name.zip" > "$name.zip.sha256")
      - name: Upload tested macOS bundle (not a signed app)
        uses: actions/upload-artifact@v4
        with:
          name: macos-source-${{ matrix.os }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/eplus-ai-toolkit-macos-${{ matrix.os }}.zip
            ${{ runner.temp }}/eplus-ai-toolkit-macos-${{ matrix.os }}.zip.sha256
          if-no-files-found: error
          retention-days: 14
