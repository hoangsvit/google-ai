name: macOS read-only compatibility
on:
  pull_request:
    paths:
      - 'macos_runner.py'
      - 'run-macos.sh'
      - 'tui.py'
      - 'tui_core.py'
      - 'tests/test_macos.py'
      - '.github/workflows/macos-readonly.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-readonly:
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install Textual for offline TUI tests
        run: python -m pip install -r requirements-tui.txt
      - name: Check shell and Python syntax
        run: |
          sh -n run-macos.sh
          python -m py_compile macos_runner.py tui.py tui_core.py
      - name: Test macOS read-only routes and checkout guards
        run: python -m unittest discover -s tests -p 'test_macos.py' -v
