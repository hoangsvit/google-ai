name: Windows release smoke tests

on:
  pull_request:
    paths:
      - ".github/workflows/windows-release-smoke.yml"
      - ".github/workflows/publish-release.yml"
      - "docs/releases/**"
      - "docs/WINDOWS-SMOKE-TEST.md"
      - "run-all.ps1"
      - "tui.py"
      - "tui_core.py"
      - "tests/**"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-smoke:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install UI test dependency only
        shell: pwsh
        run: python -m pip install --disable-pip-version-check -r requirements-tui.txt

      - name: Windows Python syntax and critical offline regressions
        shell: pwsh
        run: |
          python -m py_compile ultra0.py tui.py tui_core.py setup_env.py device_selector.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tests = @(
            "test_windows_encoding.py",
            "test_runtime_lookup.py",
            "test_tui.py",
            "test_repository_layout.py",
            "test_report_identity.py",
            "test_manual_verification.py",
            "test_adb_text_input.py"
          )
          foreach ($test in $tests) {
            python -m unittest discover -s tests -p $test -v
            if ($LASTEXITCODE -ne 0) { throw "Windows regression failed: $test" }
          }

      - name: PowerShell launcher regression checks
        shell: pwsh
        run: |
          ./tests/test_report_identity.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tests/test_terminal_prompts.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tests/test_user_errors.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: GitHub-style source ZIP extraction and startup help
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $archive = Join-Path $env:RUNNER_TEMP "eplus-ai-toolkit-source.zip"
          $extract = Join-Path $env:RUNNER_TEMP "eplus-ai-toolkit-extracted"
          git archive --format=zip --output="$archive" HEAD
          if ($LASTEXITCODE -ne 0) { throw "Source archive creation failed" }
          Expand-Archive -LiteralPath $archive -DestinationPath $extract -Force
          foreach ($path in @(
            "run-all.ps1", "tui.py", "tui_core.py", "ultra0.py",
            "requirements-tui.txt", "assets/frida/billing.js",
            "assets/modules/module_521.b64", "README.md"
          )) {
            if (-not (Test-Path -LiteralPath (Join-Path $extract $path))) {
              throw "Missing release source file: $path"
            }
          }
          Push-Location $extract
          try {
            $help = (& ./run-all.ps1 -Help | Out-String)
            if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($help)) {
              throw "PowerShell launcher help failed from extracted source ZIP"
            }
            python tui.py --help | Out-Null
            if ($LASTEXITCODE -ne 0) {
              throw "Textual CLI help failed from extracted source ZIP"
            }
          } finally {
            Pop-Location
          }
          Write-Host "Release source ZIP smoke test: PASS (no emulator or checkout)"
          $checksum = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest = Join-Path $env:RUNNER_TEMP "eplus-ai-toolkit-source.zip.sha256"
          Set-Content -LiteralPath $manifest -Value "$checksum  eplus-ai-toolkit-source.zip" -Encoding ascii
          Write-Host "Source ZIP checksum (SHA-256): $checksum"

      - name: Preserve CI-tested source ZIP and checksum for real-device validation
        uses: actions/upload-artifact@v4
        with:
          name: eplus-ai-toolkit-source-${{ github.sha }}
          path: |
            ${{ runner.temp }}/eplus-ai-toolkit-source.zip
            ${{ runner.temp }}/eplus-ai-toolkit-source.zip.sha256
          if-no-files-found: error
          retention-days: 14
