name: Static checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python syntax
        run: python -m compileall -q ultra0.py device_selector.py setup_env.py query_sku.py scripts/diagnose-activity.py
      - name: Windows Unicode output regression tests (simulated cp1252)
        run: python -m unittest discover -s tests -p 'test_windows_encoding.py' -v
      - name: Windows runtime lookup tests (simulated cp1252)
        run: python -m unittest discover -s tests -p 'test_runtime_lookup.py' -v
      - name: Runtime lookup help
        run: python scripts/runtime-lookup.py --help
      - name: Automatic Android device selection tests
        run: python -m unittest discover -s tests -p 'test_device_selector.py' -v
      - name: ADB installer tests (no Android or network)
        run: python -m unittest discover -s tests -p 'test_adb_setup.py' -v
      - name: Repository layout and branch routing (offline)
        run: python -m unittest discover -s tests -p 'test_repository_layout.py' -v
      - name: Gitignore regression tests
        run: python -m unittest discover -s tests -p 'test_gitignore.py' -v
      - name: Reusable release workflow regression checks (offline)
        run: python -m unittest discover -s tests -p 'test_release_workflow.py' -v
      - name: Maintainer and release documentation checks (offline)
        run: python -m unittest discover -s tests -p 'test_maintainer_docs.py' -v
      - name: Documentation hub and concise overviews (offline)
        run: python -m unittest discover -s tests -p 'test_docs_navigation.py' -v
      - name: Multilingual README links and safety text
        run: python -m unittest discover -s tests -p 'test_readme_locales.py' -v
      - name: Translated README source synchronization and section parity
        run: python -m unittest discover -s tests -p 'test_readme_source_parity.py' -v
      - name: English-only filenames and source checks
        run: python -m unittest discover -s tests -p 'test_english_only.py' -v
      - name: Bundled asset integrity tests (no Android)
        run: python -m unittest discover -s tests -p 'test_assets.py' -v
      - name: Textual TUI tests (offline, no Android or purchases)
        run: |
          python -m pip install --disable-pip-version-check -r requirements-tui.txt
          python -m unittest discover -s tests -p 'test_tui.py' -v
      - name: Native Mac stage and payment-guard regressions (mock only)
        run: python -m unittest discover -s tests -p 'test_macos.py' -v
      - name: Account report filename isolation (offline)
        run: python -m unittest discover -s tests -p 'test_report_identity.py' -v
      - name: Cross-language PowerShell/Python report keys
        shell: pwsh
        run: ./tests/test_report_identity.ps1
      - name: Original step mapping tests
        run: python -m unittest discover -s tests -p 'test_author_steps.py' -v
      - name: Android 15 ADB/Frida PID validation regression tests
        run: python -m unittest discover -s tests -p 'test_frida_pid.py' -v
      - name: Original flow safety regression tests (mocked, no purchases)
        run: python -m unittest discover -s tests -p 'test_original_flow.py' -v
      - name: Frida compatibility tests (mocked, no Android)
        run: python -m unittest discover -s tests -p 'test_frida_compat.py' -v
      - name: Device/account diagnostic unit tests (no Android or purchases)
        run: python -m unittest discover -s tests -p 'test_device_diagnostics.py' -v
      - name: Manual confirmation and timeout safety tests (offline)
        run: python -m unittest discover -s tests -p 'test_manual_verification.py' -v
      - name: Android text shell escaping and 2FA confidentiality (offline)
        run: python -m unittest discover -s tests -p 'test_adb_text_input.py' -v
      - name: Google Play checkout text tests (no Android or purchases)
        run: python -m unittest discover -s tests -p 'test_checkout_terms.py' -v
      - name: Billing launch diagnostics tests (no Android/purchases)
        run: python -m unittest discover -s tests -p 'test_launch_diagnostics.py' -v
      - name: Multi-device configuration and Activity fallback tests
        run: python -m unittest discover -s tests -p 'test_activity_config.py' -v
      - name: Subscription update token guard tests (no Android)
        run: python -m unittest discover -s tests -p 'test_purchase_token.py' -v
      - name: Subscription update JavaScript safety tests
        run: node --test tests/test_subscription_update.test.mjs
      - name: Dependency-free Frida Activity fallback JavaScript tests
        run: node --test tests/test_activity_lookup.test.mjs
      - name: PowerShell numbered prompt tests (offline)
        shell: pwsh
        run: ./tests/test_terminal_prompts.ps1
      - name: Friendly terminal errors (offline)
        shell: pwsh
        run: ./tests/test_user_errors.ps1
      - name: PowerShell end-to-end script parse and help check
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("run-all.ps1", [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { $parseErrors | ForEach-Object { Write-Host ("Parse error at line {0}, column {1}: {2}" -f $_.Extent.StartLineNumber, $_.Extent.StartColumnNumber, $_.Message) }; exit 1 }
          $scriptAst = [System.Management.Automation.Language.Parser]::ParseFile("run-all.ps1", [ref]$tokens, [ref]$parseErrors)
          $reservedNames = @("pid", "host", "home", "psversiontable", "myinvocation")
          $assignments = $scriptAst.FindAll({
            param($node)
            $node -is [System.Management.Automation.Language.AssignmentStatementAst]
          }, $true)
          foreach ($assignment in $assignments) {
            if ($assignment.Left -is [System.Management.Automation.Language.VariableExpressionAst]) {
              $variableName = $assignment.Left.VariablePath.UserPath.ToLowerInvariant()
              if ($reservedNames -ccontains $variableName) {
                Write-Error ("Cannot assign to PowerShell automatic variable: " + $assignment.Left.Extent.Text)
                exit 1
              }
            }
          }
          ./run-all.ps1 -Help | Out-Null
